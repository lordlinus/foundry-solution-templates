# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0'
    azure.ai.projects: '>=1.1.0'
name: medical-underwriting-copilot
metadata:
  template: medical-underwriting-copilot@v1
hooks:
  # Seeds the synthetic underwriting guidelines into the search index.
  postprovision:
    posix:
      shell: sh
      run: python3 scripts/seed_guidelines.py
    windows:
      shell: pwsh
      run: python scripts/seed_guidelines.py
services:
  ai-project:
    host: azure.ai.project
    deployments:
      # Drafts the report.
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 30
      # Reviews the draft. A different model, so the drafter does not grade its own work.
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 30
  underwriting-agent:
    host: azure.ai.agent
    project: src/agent
    language: python
    uses: [ai-project]
    kind: hosted
    name: underwriting-agent
    displayName: Medical Underwriting Agent
    description: Drafts a grounded underwriting report from an OCR'd medical record; a second model reviews it.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      - name: JUDGE_MODEL_DEPLOYMENT_NAME
        value: ${JUDGE_MODEL_DEPLOYMENT_NAME=gpt-5-mini}
      - name: SEARCH_CONNECTION_ID
        value: ${SEARCH_CONNECTION_ID}
      - name: SEARCH_INDEX_NAME
        value: ${SEARCH_INDEX_NAME}
      # Public ICD-10 and PubMed MCP servers. Set to false to keep all traffic inside Azure.
      - name: MEDICAL_MCP_ENABLED
        value: ${MEDICAL_MCP_ENABLED=true}
      # Medical records must not reach traces: keep prompt and response text out of telemetry.
      - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        value: 'false'
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: python_3_13
      entryPoint: main.py
    container:
      resources:
        cpu: '1'
        memory: 2Gi
  web:
    host: containerapp
    project: src/web
    language: js
    resourceGroup: ${AZURE_FOUNDRY_RESOURCE_GROUP}
    docker:
      remoteBuild: true
infra:
  layers:
    - provider: microsoft.foundry
      path: infra-foundry
      name: foundry
    - provider: bicep
      path: infra
      module: app
      name: app
      scope: subscription
      dependsOn:
        - foundry
